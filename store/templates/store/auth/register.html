{% extends "store/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Register - Simple E-Commerce Store{% endblock %}

{% block content %}
<h1>Register</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">Register</button>
    </form>
</div>
<p>Already have an account? <a href="{% url 'store:login' %}">Login here</a></p>
<a class="btn-back" href="{% url 'store:product_list' %}">Back to Store</a>
{% endblock %}
