{% extends "store/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Login - Simple E-Commerce Store{% endblock %}

{% block content %}
<h1>Login</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">Login</button>
    </form>
</div>
<p>Don't have an account? <a href="{% url 'store:register' %}">Register here</a></p>
<p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
<a class="btn-back" href="{% url 'store:product_list' %}">Back to Store</a>
{% endblock %}
