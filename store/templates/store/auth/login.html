{% extends "store/base.html" %}

{% block title %}Login - Simple E-Commerce Store{% endblock %}

{% block content %}
<h1>Login</h1>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <span class="error">{{ field.errors.0 }}</span>
        {% endif %}
    </div>
    {% endfor %}
    <button type="submit">Login</button>
</form>
<p>Don't have an account? <a href="{% url 'store:register' %}">Register here</a></p>
{% endblock %}
